---
name: Build Plex Media Server Container Image
on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md' # Don't trigger builds for documentation changes
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        run: ./build.sh ${{ github.sha }}
